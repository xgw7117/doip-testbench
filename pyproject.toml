[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doip-testbench"
version = "0.5.0"
description = "A hardware-free DoIP/UDS test bench: virtual ECU, protocol conformance suite and CI-ready diagnostics automation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xgw7117" }]
keywords = ["automotive", "ethernet", "doip", "uds", "iso-13400", "iso-14229", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-html>=4.0",
    "allure-pytest>=2.13",
    "ruff>=0.5",
    "mypy>=1.8",
    "udsoncan>=1.24",
]

[project.scripts]
doipbench = "doipbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: pure codec / state-machine tests, no sockets",
    "conformance: protocol conformance tests against a running virtual ECU",
    "functional: end-to-end diagnostic flows and regression scenarios",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["doipbench"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]
# N817/N818: protocol exceptions keep the domain naming used by ISO documents
# (DoIPTimeout, MessageTooLarge); renaming them would hurt readability.
ignore = ["E501", "B008", "N817", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
